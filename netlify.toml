# Netlify build settings. Netlify detects Next.js automatically and runs it
# with its Next.js runtime (server routes, proxy and API routes included).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+; pin a current LTS so builds are predictable.
  NODE_VERSION = "22"

  # Netlify's secrets scan flagged server secrets inside .next/cache — that's
  # Turbopack's internal build cache (*.sst), which records env values to know
  # when to rebuild. It is never served to visitors. Verified locally: the
  # secrets do NOT appear in .next/server or .next/static (browser code).
  # So we skip ONLY the cache folder; everything else is still scanned,
  # including browser bundles, where a real leak would show up.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**"
